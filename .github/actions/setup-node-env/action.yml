name: Setup Node environment
description: >
  Install Node 22 and restore the npm cache. Does NOT check out the repo —
  the calling job must run actions/checkout itself first, since the runner
  needs the repo on disk before it can even resolve this local action's
  action.yml.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
